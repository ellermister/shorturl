name: Docker Image CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  UPLOAD_IMAGES: true
  PUSH_IMAGES: true
  IMAGE_NAME: ellermister/shorturl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          TAGS="${{ env.IMAGE_NAME }}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "primary=${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Build the Docker image
        id: compile
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.meta.outputs.primary }}"
          docker build . --file Dockerfile --tag "$PRIMARY"
          IFS=',' read -ra EXTRA <<< "${{ steps.meta.outputs.tags }}"
          for t in "${EXTRA[@]}"; do
            docker tag "$PRIMARY" "$t"
          done
          echo "status=success" >> "$GITHUB_OUTPUT"
          docker save "$PRIMARY" > docker.tar

      - name: Login to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to registry
        if: steps.compile.outputs.status == 'success' && env.PUSH_IMAGES == 'true'
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for t in "${TAGS[@]}"; do
            docker push "$t"
          done

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_IMAGES == 'true'
        with:
          name: ShortURL_Images${{ env.FILE_DATE }}
          path: docker.tar
          retention-days: 7
